<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowTask</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <h2>FlowTask</h2>
        </div>

        <nav>

            <ul>
                <li><a href="equipe">Equipe</a></li>
                <li><a href="calculadora.html">Calculadora Fiscal</a></li>
                <li><a href="solicitacoes.html">Solicitações</a></li>
                <li><a href="configuracoes">Configurações</a></li>
            </ul>

        </nav>

    </aside>

    <!-- CONTEÚDO -->

    <main>

        <!-- HEADER -->

        <header class="header">

            <div class="search-box">
                <span class="search-box-icon">🔍 </span>
                <input
                    type="text"
                    placeholder="Pesquisar tarefas...">

            </div>

            <div class="header-right">

                <button id="abrir", class="btn-add">
                    + Nova Tarefa
                </button>
                
                <div class="user">
                    CA
                </div>

            </div>

        </header>

        <!-- KANBAN -->

        <section class="board">

            <!-- Pendências -->

            <div class="column">

                <div class="column-header">

                    <div class="column-title">

                        <h3>Pendências</h3>

                        <span class="task-count danger">
                            1
                        </span>

                    </div>

                    <button class="add-task">+</button>

                </div>

                <div class="task-list">

                    <div class="card priority-high">

                        <span class="priority priority-high">Alta</span>

                        <h4>
                            Produto: 54608
                        </h4>

                        <div class="card-footer">

                            <span class="card-date">
                                📅 04 Ago
                            </span>

                            <div class="avatar">
                                CA
                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Pronto -->

            <div class="column">

                <div class="column-header">

                    <div class="column-title">

                        <h3>Pronto</h3>

                        <span class="task-count warning">
                            1
                        </span>

                    </div>

                    <button class="add-task">+</button>

                </div>

                <div class="task-list">

                    <div class="card priority-medium">

                        <span class="priority priority-medium">Média</span>
                        </span>

                        <h4>
                            Produto: 465543
                        </h4>

                        <div class="card-footer">

                            <span class="card-date">
                                📅 06 Ago
                            </span>

                            <div class="avatar">
                                CA
                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Em andamento -->

            <div class="column">

                <div class="column-header">

                    <div class="column-title">

                        <h3>Em Andamento</h3>

                        <span class="task-count info">
                            1
                        </span>

                    </div>

                    <button class="add-task">+</button>

                </div>

                <div class="task-list">

                    <div class="card priority-low">

                        <span class="priority priority-low">Baixa</span>
                        </span>

                        <h4>
                            Produto: 78123
                        </h4>

                        <div class="card-footer">

                            <span class="card-date">
                                📅 08 Ago
                            </span>

                            <div class="avatar">
                                CA
                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Revisão -->

            <div class="column">

                <div class="column-header">

                    <div class="column-title">

                        <h3>Revisão</h3>

                    </div>

                    <button class="add-task">+</button>

                </div>

                <div class="task-list">

                </div>

            </div>

            <!-- Concluído -->

            <div class="column">

                <div class="column-header">

                    <div class="column-title">

                        <h3>Concluído</h3>

                    </div>

                    <button class="add-task">+</button>

                </div>

                <div class="task-list">

                </div>

            </div>

        </section>

    </main>
<script src="index.js"></script>
</body>

</html>
