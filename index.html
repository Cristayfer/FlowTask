<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowTask</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <aside class="sidebar">  
        <div class="logo">
            <h2>FlowTask</h2>
        </div>

        <nav>
            <ul>
                <li>DashBoard</li>
                <li>Projetos</li>
                <li>Equipe</li>
                <li>Calendario</li>
                <li>Configurações</li>
            </ul>
        </nav>

    </aside>

    <main>

        <header class="header">
            <div class="search-box">
                <input 
                type="text"
                placeholder="Pesquisar tarefas..."
                >
            </div>

            <div class="header-right">
                <button class="btn-add">
                    + Nova Tarefa
                </button>
            
                <div class="user">
                    ○ CA
                </div>
            </div>

        </header>

        <section class="board">
            <div class="column">
                <h3>Pêndencias</h3>
                <div class="card">
                    Criar tela de login
                </div>
                <div class="card">
                    Planejar banco de dados
                </div>
            </div>
            <div class="column">
                <h3>Pronto</h3>
                <div class="card">
                    Desenvolver o Header
                </div>
            </div>
            <div class="column">
                <h3>Em Andamento</h3>
                <div class="card">
                    Criar sidebar
                </div>
            </div>
            <div class="column">
                <h3>Revisão</h3>
                <div class="card">
                    Revisar CSS
                </div>
            </div>
            <div class="column">
                <h3>Concluído</h3>
                <div class="card">
                    Criar estrutura HTML
                </div>
            </div>
        </section>

    </main>

</body>

</html>
